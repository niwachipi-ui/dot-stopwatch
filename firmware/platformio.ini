; dot for M5Stack StopWatch - firmware (wifi-voice-33 相当)
; ライブラリは PlatformIO が自動でダウンロードします。
[env:m5stack-stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWEBSOCKETS_MAX_DATA_SIZE=4096
    -DWEBSOCKETS_TCP_TIMEOUT=1500
    -DWEBSOCKETS_NETWORK_TYPE=10
    -DNODEBUG_WEBSOCKETS
    -Isrc
; 作者の環境では別プロジェクトのライブラリ置き場を参照していました。
; 配布版では同じ版を lib_deps で直接指定しています。
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.26
    https://github.com/m5stack/M5Unified.git#4fb444784c85791e0b0207701392b42be234b2e7
; WebSockets（arduinoWebSockets 2.7.2 に vendor.patch を当てたもの）は lib/WebSockets に同梱
